name: Build

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        description: 'Node version for all builds'
        default: '22'
        required: false
      wails_version:
        type: string
        description: 'Wails CLI version for all builds'
        default: 'v2.16.0'
        required: false
      build_type:
        type: string
        description: 'Build type (e.g., release or debug)'
        default: 'release'
        required: false
      notarize:
        type: boolean
        description: "Whether to notarize the MacOS application (Darwin builds only)"
        default: false

# Each platform builds natively on its own runner. Go is read from go.mod.
jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: release_bins_linux_amd64
          - runner: ubuntu-22.04-arm
            artifact: release_bins_linux_arm64
          - runner: windows-latest
            artifact: release_bins_windows_amd64
    uses: ./.github/workflows/build-native.yaml
    secrets: inherit
    with:
      RUNNER: ${{ matrix.runner }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      NODE_VERSION: ${{ inputs.node_version }}
      WAILS_VERSION: ${{ inputs.wails_version }}
      BUILD_TYPE: ${{ inputs.build_type }}

  build-darwin:
    uses: ./.github/workflows/build-darwin.yaml
    secrets: inherit
    with:
      NODE_VERSION: ${{ inputs.node_version }}
      WAILS_VERSION: ${{ inputs.wails_version }}
      BUILD_TYPE: ${{ inputs.build_type }}
      NOTARIZE: ${{ inputs.notarize }}
